<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camilla Ferrari</title>
<meta name="description" content="Decoupage on porcelain and glass, handmade by Camilla Ferrari in Brazil.">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { --bg:#F8F5F0; --ink:#3b302c; --accent:#B0685C; --muted:#7a6a63; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:72px 20px 48px; text-align:center; }
  img.logo { width:132px; height:132px; border-radius:24px; }
  h1 { font-weight:normal; font-size:2.4rem; letter-spacing:.02em; margin:28px 0 8px; }
  p.tag { font-style:italic; color:var(--muted); font-size:1.15rem; margin:0 0 40px; }
  hr { border:none; border-top:1px solid #e3d9d1; width:80px; margin:0 auto 32px; }
  p { margin:0 0 16px; }
  a { color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:.9rem; padding:24px 20px 48px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.png" alt="Camilla Ferrari monogram">
  <h1>Camilla Ferrari</h1>
  <p class="tag">Decoupage on porcelain and glass, handmade in Brazil.</p>
  <hr>
  <p>Handmade decoupage pieces and the inspiration behind them.</p>
  <p><a href="privacy.html">Privacy Policy &mdash; Camilla Ferrari Board Organizer</a></p>
</main>
<footer>&copy; 2026 Camilla Ferrari</footer>
</body>
</html>
